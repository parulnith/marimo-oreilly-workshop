<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 1 Quiz Viewer</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --panel: #fffdf9;
        --ink: #1f2430;
        --muted: #6b7280;
        --accent: #e85d04;
        --accent-2: #ffba08;
        --border: #e7dfd3;
        --success-bg: #eefbf3;
        --success-border: #8fd3a7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(255, 186, 8, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(232, 93, 4, 0.14), transparent 24%),
          var(--bg);
        color: var(--ink);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 24px 56px;
      }

      .eyebrow {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.05;
      }

      .sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .progress {
        width: 100%;
        height: 12px;
        background: #ece4d8;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 28px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        transition: width 220ms ease;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(31, 36, 48, 0.06);
      }

      .question {
        font-size: clamp(1.3rem, 2.6vw, 2rem);
        line-height: 1.3;
        margin: 0 0 24px;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        border: 1px solid var(--border);
        background: white;
        border-radius: 18px;
        padding: 16px 18px;
        font-size: 1rem;
        line-height: 1.45;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      .option:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }

      .option.selected {
        border-color: var(--accent);
        background: #fff3eb;
      }

      .option.correct {
        border-color: #4ca66a;
        background: #eefbf3;
      }

      .option.dimmed {
        opacity: 0.68;
      }

      .answer-panel {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid var(--success-border);
        background: var(--success-bg);
        display: none;
      }

      .answer-panel.show {
        display: block;
      }

      .answer-title {
        margin: 0 0 8px;
        font-weight: 700;
      }

      .answer-text {
        margin: 0;
        line-height: 1.6;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }

      .controls-left,
      .controls-right {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-neutral {
        background: #ece4d8;
        color: var(--ink);
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-muted {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .footer-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 680px) {
        .wrap {
          padding: 24px 16px 40px;
        }

        .card {
          padding: 20px;
          border-radius: 18px;
        }

        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .controls-left,
        .controls-right {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="eyebrow">Workshop Quiz</div>
      <h1>Module 1 Checkpoint</h1>
      

      <div class="progress-meta">
        <span id="progress-label">Question 1 of 5</span>
        <span id="module-label">Why Interactive Programming Environments Matter</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="card">
        <h2 class="question" id="question"></h2>
        <div class="options" id="options"></div>

        <div class="answer-panel" id="answer-panel">
          <p class="answer-title" id="answer-title"></p>
          <p class="answer-text" id="answer-text"></p>
        </div>

        <div class="controls">
          <div class="controls-left">
            <button class="btn-neutral" id="prev-btn">Previous</button>
            <button class="btn-neutral" id="next-btn">Next</button>
          </div>
          <div class="controls-right">
            <button class="btn-muted" id="reset-btn">Reset Question</button>
            <button class="btn-muted" id="retake-btn">Retake Quiz</button>
            <button class="btn-primary" id="reveal-btn">Reveal Answer</button>
          </div>
        </div>

        <p class="footer-note">
          Shortcuts: <strong>1–4</strong> select option, <strong>space</strong> reveal/next, <strong>←/→</strong> previous/next.
        </p>
      </div>
    </div>

    <script>
      const questions = [
        {
          question: "Why are interactive programming environments so important for AI and ML?",
          options: [
            "They compile Python code faster",
            "They shorten the write-see-adjust loop",
            "They replace machine learning libraries",
            "They avoid the need for intermediate results",
          ],
          answer: 1,
          explanation:
            "Module 1 emphasizes that AI and ML work depends on a fast write-see-adjust loop: write code, inspect results, and adjust quickly.",
        },
        {
          question: "What is the main problem with out-of-order execution in a traditional notebook?",
          options: [
            "Jupyter automatically re-runs all dependent cells",
            "The notebook code and outputs can drift out of sync",
            "The notebook becomes read-only",
            "Hidden state is removed automatically",
          ],
          answer: 1,
          explanation:
            "If you change an upstream cell but forget to re-run downstream cells, the code on screen can say one thing while the outputs still reflect an older state.",
        },
        {
          question: "What is hidden state in a notebook?",
          options: [
            "A value or function still alive in memory after its cell is gone",
            "A variable that exists only in Git history",
            "A slider value that updates automatically",
            "A plotting bug in matplotlib",
          ],
          answer: 0,
          explanation:
            "Hidden state means notebook state survives in memory even though the notebook no longer clearly shows where it came from.",
        },
        {
          question: "What does reactive execution change?",
          options: [
            "It allows cells to safely run in random order",
            "It keeps code, outputs, and state aligned through a dependency graph",
            "It removes the need for functions",
            "It disables downstream execution completely",
          ],
          answer: 1,
          explanation:
            "Reactive execution tracks dependencies between cells, so when an upstream value changes, dependent cells update automatically.",
        },
        {
          question: "In Module 1, how should you think about sliders in marimo?",
          options: [
            "They are the main reason marimo is reactive",
            "They replace the dependency graph",
            "They are a visible way to feel the reactivity",
            "They are required for marimo notebooks to run",
          ],
          answer: 2,
          explanation:
            "The key idea is dependency-aware execution. Sliders are just an easy way to see that reactivity in action.",
        },
      ];

      let currentIndex = 0;
      let selectedIndex = null;
      let revealed = false;

      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const answerPanelEl = document.getElementById("answer-panel");
      const answerTitleEl = document.getElementById("answer-title");
      const answerTextEl = document.getElementById("answer-text");
      const progressLabelEl = document.getElementById("progress-label");
      const progressBarEl = document.getElementById("progress-bar");

      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const revealBtn = document.getElementById("reveal-btn");
      const resetBtn = document.getElementById("reset-btn");
      const retakeBtn = document.getElementById("retake-btn");

      function render() {
        const q = questions[currentIndex];
        questionEl.textContent = q.question;
        progressLabelEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        progressBarEl.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

        optionsEl.innerHTML = "";
        q.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.className = "option";
          button.type = "button";
          button.innerHTML = `<strong>${String.fromCharCode(65 + index)}.</strong> ${option}`;

          if (selectedIndex === index) {
            button.classList.add("selected");
          }

          if (revealed) {
            if (index === q.answer) {
              button.classList.add("correct");
            } else {
              button.classList.add("dimmed");
            }
          }

          button.addEventListener("click", () => {
            if (revealed) return;
            selectedIndex = index;
            render();
          });

          optionsEl.appendChild(button);
        });

        if (revealed) {
          answerPanelEl.classList.add("show");
          answerTitleEl.textContent =
            selectedIndex === q.answer
              ? "Correct"
              : `Answer: ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`;
          answerTextEl.textContent = q.explanation;
          revealBtn.textContent = currentIndex === questions.length - 1 ? "Quiz Complete" : "Next Question";
        } else {
          answerPanelEl.classList.remove("show");
          answerTitleEl.textContent = "";
          answerTextEl.textContent = "";
          revealBtn.textContent = "Reveal Answer";
        }

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === questions.length - 1;
      }

      function nextQuestion() {
        if (currentIndex < questions.length - 1) {
          currentIndex += 1;
          selectedIndex = null;
          revealed = false;
          render();
        }
      }

      function prevQuestion() {
        if (currentIndex > 0) {
          currentIndex -= 1;
          selectedIndex = null;
          revealed = false;
          render();
        }
      }

      revealBtn.addEventListener("click", () => {
        if (!revealed) {
          revealed = true;
          render();
        } else {
          nextQuestion();
        }
      });

      nextBtn.addEventListener("click", nextQuestion);
      prevBtn.addEventListener("click", prevQuestion);
      resetBtn.addEventListener("click", () => {
        selectedIndex = null;
        revealed = false;
        render();
      });

      retakeBtn.addEventListener("click", () => {
        currentIndex = 0;
        selectedIndex = null;
        revealed = false;
        render();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          if (!revealed) {
            revealed = true;
            render();
          } else {
            nextQuestion();
          }
        }

        if (!revealed && ["1", "2", "3", "4"].includes(event.key)) {
          selectedIndex = Number(event.key) - 1;
          render();
        }

        if (event.key === "ArrowRight") {
          nextQuestion();
        }

        if (event.key === "ArrowLeft") {
          prevQuestion();
        }
      });

      render();
    </script>
  </body>
  </html>
