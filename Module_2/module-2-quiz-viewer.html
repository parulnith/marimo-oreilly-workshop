<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Module 2 Quiz Viewer</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --panel: #fffdf9;
        --ink: #1f2430;
        --muted: #6b7280;
        --accent: #0f766e;
        --accent-2: #5eead4;
        --border: #e7dfd3;
        --success-bg: #eefbf3;
        --success-border: #8fd3a7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(94, 234, 212, 0.18), transparent 28%),
          radial-gradient(circle at top right, rgba(15, 118, 110, 0.14), transparent 24%),
          var(--bg);
        color: var(--ink);
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 40px 24px 56px;
      }

      .eyebrow {
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
        margin-bottom: 8px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 4vw, 3.4rem);
        line-height: 1.05;
      }

      .sub {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      .progress-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
        font-size: 0.95rem;
        color: var(--muted);
      }

      .progress {
        width: 100%;
        height: 12px;
        background: #ece4d8;
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 28px;
      }

      .progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        transition: width 220ms ease;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 28px;
        box-shadow: 0 10px 30px rgba(31, 36, 48, 0.06);
      }

      .question {
        font-size: clamp(1.3rem, 2.6vw, 2rem);
        line-height: 1.3;
        margin: 0 0 24px;
      }

      .options {
        display: grid;
        gap: 12px;
      }

      .option {
        border: 1px solid var(--border);
        background: white;
        border-radius: 18px;
        padding: 16px 18px;
        font-size: 1rem;
        line-height: 1.45;
        cursor: pointer;
        transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
      }

      .option:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
      }

      .option.selected {
        border-color: var(--accent);
        background: #ecfdfa;
      }

      .option.correct {
        border-color: #4ca66a;
        background: #eefbf3;
      }

      .option.dimmed {
        opacity: 0.68;
      }

      .answer-panel {
        margin-top: 24px;
        padding: 18px 20px;
        border-radius: 18px;
        border: 1px solid var(--success-border);
        background: var(--success-bg);
        display: none;
      }

      .answer-panel.show {
        display: block;
      }

      .answer-title {
        margin: 0 0 8px;
        font-weight: 700;
      }

      .answer-text {
        margin: 0;
        line-height: 1.6;
      }

      .controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 24px;
      }

      .controls-left,
      .controls-right {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        font-size: 0.95rem;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-neutral {
        background: #ece4d8;
        color: var(--ink);
      }

      .btn-primary {
        background: var(--accent);
        color: white;
      }

      .btn-muted {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--muted);
      }

      .footer-note {
        margin-top: 18px;
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 680px) {
        .wrap {
          padding: 24px 16px 40px;
        }

        .card {
          padding: 20px;
          border-radius: 18px;
        }

        .controls {
          flex-direction: column;
          align-items: stretch;
        }

        .controls-left,
        .controls-right {
          width: 100%;
          justify-content: space-between;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="eyebrow">Workshop Quiz</div>
      <h1>Module 2 Checkpoint</h1>
      <p class="sub">
        Reproducibility as a baseline for trustworthy AI.
      </p>

      <div class="progress-meta">
        <span id="progress-label">Question 1 of 5</span>
        <span id="module-label">Reproducibility, environments, and reviewable notebooks</span>
      </div>
      <div class="progress" aria-hidden="true">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="card">
        <h2 class="question" id="question"></h2>
        <div class="options" id="options"></div>

        <div class="answer-panel" id="answer-panel">
          <p class="answer-title" id="answer-title"></p>
          <p class="answer-text" id="answer-text"></p>
        </div>

        <div class="controls">
          <div class="controls-left">
            <button class="btn-neutral" id="prev-btn">Previous</button>
            <button class="btn-neutral" id="next-btn">Next</button>
          </div>
          <div class="controls-right">
            <button class="btn-muted" id="reset-btn">Reset Question</button>
            <button class="btn-muted" id="retake-btn">Retake Quiz</button>
            <button class="btn-primary" id="reveal-btn">Reveal Answer</button>
          </div>
        </div>

        <p class="footer-note">
          Shortcuts: <strong>1–4</strong> select option, <strong>space</strong> reveal/next, <strong>←/→</strong> previous/next.
        </p>
      </div>
    </div>

    <script>
      const questions = [
        {
          question: "What is environmental drift?",
          options: [
            "A plotting bug caused by stale outputs",
            "A change in results caused by changes in the environment around the code",
            "A marimo-specific package installation failure",
            "A Git merge conflict in a notebook file",
          ],
          answer: 1,
          explanation:
            "Environmental drift means the code stays the same, but the Python version, library versions, or system configuration changes, causing different results.",
        },
        {
          question: "What problem is Module 2 mainly trying to solve?",
          options: [
            "How to make sliders update more quickly",
            "How to make notebooks smaller on disk",
            "How to get the same results across machines and over time",
            "How to avoid writing helper functions",
          ],
          answer: 2,
          explanation:
            "Module 2 is about reproducibility beyond a single session: across different computers, environments, and points in time.",
        },
        {
          question: "In marimo, what does --sandbox do?",
          options: [
            "It disables reactive execution",
            "It creates an isolated per-notebook environment",
            "It exports the notebook as HTML",
            "It hides the code in app mode",
          ],
          answer: 1,
          explanation:
            "--sandbox creates an isolated environment for the notebook and lets marimo track dependencies directly in the notebook file.",
        },
        {
          question: "Why are marimo notebooks easier to review in Git than Jupyter notebooks?",
          options: [
            "They hide execution counts automatically",
            "They are stored as plain .py files instead of JSON",
            "They remove all outputs before saving",
            "They cannot contain plots or tables",
          ],
          answer: 1,
          explanation:
            "marimo notebooks are plain Python files, so diffs show actual code changes instead of large JSON blobs full of metadata and outputs.",
        },
        {
          question: "What is one key idea behind marimo's inline dependency metadata?",
          options: [
            "The notebook and its environment spec travel together in one file",
            "Every notebook must share one global virtual environment",
            "Dependencies are stored only in requirements.txt",
            "The notebook cannot be run as a script",
          ],
          answer: 0,
          explanation:
            "marimo stores dependency information directly in the notebook file, so the notebook and its environment specification remain a single artifact.",
        },
      ];

      let currentIndex = 0;
      let selectedIndex = null;
      let revealed = false;

      const questionEl = document.getElementById("question");
      const optionsEl = document.getElementById("options");
      const answerPanelEl = document.getElementById("answer-panel");
      const answerTitleEl = document.getElementById("answer-title");
      const answerTextEl = document.getElementById("answer-text");
      const progressLabelEl = document.getElementById("progress-label");
      const progressBarEl = document.getElementById("progress-bar");

      const prevBtn = document.getElementById("prev-btn");
      const nextBtn = document.getElementById("next-btn");
      const revealBtn = document.getElementById("reveal-btn");
      const resetBtn = document.getElementById("reset-btn");
      const retakeBtn = document.getElementById("retake-btn");

      function render() {
        const q = questions[currentIndex];
        questionEl.textContent = q.question;
        progressLabelEl.textContent = `Question ${currentIndex + 1} of ${questions.length}`;
        progressBarEl.style.width = `${((currentIndex + 1) / questions.length) * 100}%`;

        optionsEl.innerHTML = "";
        q.options.forEach((option, index) => {
          const button = document.createElement("button");
          button.className = "option";
          button.type = "button";
          button.innerHTML = `<strong>${String.fromCharCode(65 + index)}.</strong> ${option}`;

          if (selectedIndex === index) {
            button.classList.add("selected");
          }

          if (revealed) {
            if (index === q.answer) {
              button.classList.add("correct");
            } else {
              button.classList.add("dimmed");
            }
          }

          button.addEventListener("click", () => {
            if (revealed) return;
            selectedIndex = index;
            render();
          });

          optionsEl.appendChild(button);
        });

        if (revealed) {
          answerPanelEl.classList.add("show");
          answerTitleEl.textContent =
            selectedIndex === q.answer
              ? "Correct"
              : `Answer: ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}`;
          answerTextEl.textContent = q.explanation;
          revealBtn.textContent = currentIndex === questions.length - 1 ? "Quiz Complete" : "Next Question";
        } else {
          answerPanelEl.classList.remove("show");
          answerTitleEl.textContent = "";
          answerTextEl.textContent = "";
          revealBtn.textContent = "Reveal Answer";
        }

        prevBtn.disabled = currentIndex === 0;
        nextBtn.disabled = currentIndex === questions.length - 1;
      }

      function nextQuestion() {
        if (currentIndex < questions.length - 1) {
          currentIndex += 1;
          selectedIndex = null;
          revealed = false;
          render();
        }
      }

      function prevQuestion() {
        if (currentIndex > 0) {
          currentIndex -= 1;
          selectedIndex = null;
          revealed = false;
          render();
        }
      }

      revealBtn.addEventListener("click", () => {
        if (!revealed) {
          revealed = true;
          render();
        } else {
          nextQuestion();
        }
      });

      nextBtn.addEventListener("click", nextQuestion);
      prevBtn.addEventListener("click", prevQuestion);
      resetBtn.addEventListener("click", () => {
        selectedIndex = null;
        revealed = false;
        render();
      });
      retakeBtn.addEventListener("click", () => {
        currentIndex = 0;
        selectedIndex = null;
        revealed = false;
        render();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === " ") {
          event.preventDefault();
          if (!revealed) {
            revealed = true;
            render();
          } else {
            nextQuestion();
          }
        }

        if (!revealed && ["1", "2", "3", "4"].includes(event.key)) {
          selectedIndex = Number(event.key) - 1;
          render();
        }

        if (event.key === "ArrowRight") {
          nextQuestion();
        }

        if (event.key === "ArrowLeft") {
          prevQuestion();
        }
      });

      render();
    </script>
  </body>
  </html>
